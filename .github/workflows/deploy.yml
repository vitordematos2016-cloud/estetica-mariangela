name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checar tamanho do secret REMOTE_DIR (nao expoe o valor)
        continue-on-error: true
        env:
          REMOTE_DIR_VALUE: ${{ secrets.REMOTE_DIR }}
        run: |
          {
            echo "=== REMOTE_DIR ==="
            echo "comprimento: ${#REMOTE_DIR_VALUE}"
            echo "primeiro caractere (codigo ascii, 0 se vazio): $(printf '%s' "$REMOTE_DIR_VALUE" | head -c1 | od -An -tu1 | tr -d ' ')"
            echo "ultimo caractere (codigo ascii, 0 se vazio): $(printf '%s' "$REMOTE_DIR_VALUE" | tail -c1 | od -An -tu1 | tr -d ' ')"
          } > remote-dir-check.txt
          cat remote-dir-check.txt

      - name: Diagnosticar raiz FTP e pasta alvo (somente leitura)
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          {
            echo "=== Raiz do FTP (/) ==="
            curl -s --connect-timeout 15 --max-time 30 --ftp-method nocwd "ftp://${FTP_HOST}/" --user "${FTP_USER}:${FTP_PASS}"
            echo ""
            echo "=== ./estetica-mariangela/ ==="
            curl -s --connect-timeout 15 --max-time 30 --ftp-method nocwd "ftp://${FTP_HOST}/estetica-mariangela/" --user "${FTP_USER}:${FTP_PASS}"
          } > ftp-diagnostico.txt
          cat ftp-diagnostico.txt

      - name: Publicar diagnostico no repositorio (temporario)
        continue-on-error: true
        run: |
          cp ftp-diagnostico.txt docs/ftp-diagnostico.txt
          cp remote-dir-check.txt docs/remote-dir-check.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ftp-diagnostico.txt docs/remote-dir-check.txt
          git commit -m "chore: diagnostico FTP automatico [skip ci]" || echo "nada para commitar"
          git push

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.REMOTE_DIR }}
          log-level: verbose

      - name: Diagnosticar pasta alvo pos-deploy (somente leitura)
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          {
            echo "=== ./estetica-mariangela/ (pos-deploy) ==="
            curl -s --connect-timeout 15 --max-time 30 --ftp-method nocwd "ftp://${FTP_HOST}/estetica-mariangela/" --user "${FTP_USER}:${FTP_PASS}"
          } > ftp-diagnostico-pos.txt
          cat ftp-diagnostico-pos.txt

      - name: Publicar diagnostico pos-deploy no repositorio (temporario)
        continue-on-error: true
        run: |
          cp ftp-diagnostico-pos.txt docs/ftp-diagnostico-pos.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/ftp-diagnostico-pos.txt
          git commit -m "chore: diagnostico FTP pos-deploy automatico [skip ci]" || echo "nada para commitar"
          git push
