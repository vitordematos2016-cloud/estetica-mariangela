name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Diagnosticar raiz FTP e pasta alvo (somente leitura)
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          {
            echo "=== Raiz do FTP (/) ==="
            curl -s --ftp-method nocwd "ftp://${FTP_HOST}/" --user "${FTP_USER}:${FTP_PASS}"
            echo ""
            echo "=== ./estetica-mariangela/ ==="
            curl -s --ftp-method nocwd "ftp://${FTP_HOST}/estetica-mariangela/" --user "${FTP_USER}:${FTP_PASS}"
          } > ftp-diagnostico.txt
          cat ftp-diagnostico.txt

      - name: Publicar diagnostico no repositorio (temporario)
        continue-on-error: true
        run: |
          cp ftp-diagnostico.txt docs/ftp-diagnostico.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ftp-diagnostico.txt
          git commit -m "chore: diagnostico FTP automatico [skip ci]" || echo "nada para commitar"
          git push

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.REMOTE_DIR }}
